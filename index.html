<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For You 🌷</title>
  
  <style>
    /* ---------- Monochrome palette, red accent ---------- */
    :root {
      --black: #0d0d0d;
      --ink: #1a1a1a;
      --grey-900: #2b2b2b;
      --grey-700: #555;
      --grey-400: #999;
      --grey-200: #d9d9d9;
      --paper: #fafafa;
      --red: #c1121f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: radial-gradient(circle at 50% 30%, #1a1a1a 0%, #0d0d0d 70%);
      font-family: "Georgia", "Times New Roman", serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* ---------- Petals ---------- */
    #petals {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }

    .petal {
      position: absolute;
      top: -30px;
      width: 12px;
      height: 12px;
      background: var(--red);
      border-radius: 50% 50% 50% 0;
      opacity: 0.85;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0%   { transform: translateY(-30px) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.85; }
      100% { transform: translateY(105vh) rotate(540deg); opacity: 0; }
    }

    /* ---------- Scene ---------- */
    .scene {
      position: relative;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* ---------- Envelope ---------- */
    .envelope {
      position: relative;
      width: min(88vw, 380px);
      aspect-ratio: 4 / 3;
      cursor: pointer;
      perspective: 1200px;
      z-index: 10;
    }

    .env-back {
      position: absolute;
      inset: 0;
      background: var(--grey-900);
      border-radius: 6px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.8);
    }

    .env-front { position: absolute; inset: 0; pointer-events: none; }

    .flap-left,
    .flap-right,
    .flap-bottom {
      position: absolute;
      background: var(--grey-700);
      transition: transform 0.5s ease;
    }

    .flap-left {
      top: 0; left: 0; width: 50%; height: 100%;
      clip-path: polygon(0 0, 100% 50%, 0 100%);
      border-radius: 6px 0 0 6px;
    }

    .flap-right {
      top: 0; right: 0; width: 50%; height: 100%;
      clip-path: polygon(100% 0, 0 50%, 100% 100%);
      border-radius: 0 6px 6px 0;
    }

    .flap-bottom {
      bottom: 0; left: 0; width: 100%; height: 100%;
      clip-path: polygon(0 100%, 50% 42%, 100% 100%);
      background: var(--grey-900);
      border-radius: 0 0 6px 6px;
      z-index: 2;
    }

    .flap-top {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 60%;
      background: var(--grey-900);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      border-radius: 6px 6px 0 0;
      transform-origin: top center;
      transition: transform 0.7s cubic-bezier(0.4, 0.0, 0.2, 1);
      z-index: 3;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .envelope.open .flap-top { transform: rotateX(180deg); }

    /* ---------- Letter Card ---------- */
    .letter-card {
      position: absolute;
      left: 6%;
      width: 88%;
      top: 10%;
      height: 80%;
      background: var(--paper);
      
      /* THIS IS THE TULIP BACKGROUND FOR THE PAPER */
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23c1121f' fill-opacity='0.08'%3E%3Cpath d='M30 10 C25 5 20 10 22 18 C24 26 30 30 30 35 C30 30 36 26 38 18 C40 10 35 5 30 10 Z'/%3E%3C/g%3E%3C/svg%3E");
      background-size: 40px 40px;

      border-radius: 4px;
      padding: 18px 16px;
      z-index: 4;
      transform: translateY(0) scale(0.96);
      opacity: 0;
      transition: transform 0.8s 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s 0.4s ease;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      overflow-y: auto;
    }

    .envelope.open .letter-card {
      transform: translateY(-38%) scale(1);
      opacity: 1;
      z-index: 10; /* On top of everything so button works */
    }

    .letter-inner { color: var(--ink); font-size: 0.95rem; line-height: 1.6; }

    .letter-to, .letter-from {
      font-family: "Courier New", monospace;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--grey-700);
    }

    .letter-to { margin-bottom: 14px; }
    .letter-from { margin-top: 16px; text-align: right; }
    .placeholder { color: var(--grey-400); font-style: italic; }

    .letter-body { white-space: pre-wrap; color: var(--ink); font-size: 0.95rem; min-height: 60px; }

    /* ---------- Close Button ---------- */
    .close-btn {
      position: absolute;
      top: 8px; right: 8px;
      background: transparent;
      border: none;
      font-size: 1.6rem;
      line-height: 1;
      color: var(--grey-400);
      cursor: pointer;
      transition: color 0.3s, transform 0.3s;
      padding: 4px;
      z-index: 20; 
    }

    .close-btn:hover { color: var(--red); transform: scale(1.1); }

    /* ---------- Closing Animation ---------- */
    .envelope.closing .letter-card {
      transform: translateY(0) scale(0.96);
      opacity: 0;
      transition: transform 0.6s ease, opacity 0.4s 0.2s ease;
    }

    .envelope.closing .flap-top {
      transform: rotateX(0deg);
      transition: transform 0.6s 0.4s cubic-bezier(0.4, 0.0, 0.2, 1);
    }

    /* ---------- 3D CSS Bouquet (Appears when closed) ---------- */
    .bouquet {
      position: absolute;
      top: 45%; left: 50%;
      transform: translate(-50%, -50%);
      width: 280px; height: 280px;
      pointer-events: none;
      z-index: 1; /* Stays BEHIND the envelope */
    }

    .bouquet svg {
      position: absolute;
      bottom: 0; left: 50%;
      width: 60px; height: auto;
      opacity: 0;
      transform-origin: bottom center;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8));
    }

    .bouquet.show .t-center { animation: bloomCenter 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .bouquet.show .t-left   { animation: bloomLeft 1s 0.1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .bouquet.show .t-right  { animation: bloomRight 1s 0.1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

    @keyframes bloomCenter {
      0% { opacity: 0; transform: translateX(-50%) scale(0) translateY(20px); }
      100% { opacity: 1; transform: translateX(-50%) scale(1.3) translateY(0); }
    }
    @keyframes bloomLeft {
      0% { opacity: 0; transform: translateX(-50%) rotate(-40deg) scale(0); }
      100% { opacity: 1; transform: translateX(-120%) rotate(-20deg) scale(1.1); }
    }
    @keyframes bloomRight {
      0% { opacity: 0; transform: translateX(-50%) rotate(40deg) scale(0); }
      100% { opacity: 1; transform: translateX(20%) rotate(20deg) scale(1.1); }
    }

    /* ---------- Hint ---------- */
    .hint {
      position: absolute;
      bottom: -46px; left: 50%;
      transform: translateX(-50%);
      color: var(--grey-400);
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-family: "Courier New", monospace;
      white-space: nowrap;
      animation: pulse 2.2s ease-in-out infinite;
      transition: opacity 0.3s;
    }

    .envelope.open .hint { opacity: 0; }

    @keyframes pulse {
      0%, 100% { opacity: 0.45; }
      50%      { opacity: 1; }
    }

    @media (max-width: 400px) {
      .letter-inner { font-size: 0.88rem; }
      .letter-card { padding: 14px 12px; }
      .bouquet { width: 220px; height: 220px; }
    }
  </style>
</head>
<body>

  <!-- Falling petals layer -->
  <div id="petals" aria-hidden="true"></div>

  <!-- Envelope scene -->
  <main class="scene">
    
    <!-- 3D CSS Bouquet -->
    <div class="bouquet" id="bouquet">
      <svg viewBox="0 0 64 96" xmlns="http://www.w3.org/2000/svg" class="t-left">
        <path d="M32 12 C22 4 12 10 14 24 C16 38 26 44 32 50 C38 44 48 38 50 24 C52 10 42 4 32 12 Z" fill="#c1121f"/>
        <rect x="30" y="50" width="4" height="46" rx="2" fill="#1a1a1a"/>
      </svg>
      <svg viewBox="0 0 64 96" xmlns="http://www.w3.org/2000/svg" class="t-right">
        <path d="M32 12 C22 4 12 10 14 24 C16 38 26 44 32 50 C38 44 48 38 50 24 C52 10 42 4 32 12 Z" fill="#c1121f"/>
        <rect x="30" y="50" width="4" height="46" rx="2" fill="#1a1a1a"/>
      </svg>
      <svg viewBox="0 0 64 96" xmlns="http://www.w3.org/2000/svg" class="t-center">
        <path d="M32 12 C22 4 12 10 14 24 C16 38 26 44 32 50 C38 44 48 38 50 24 C52 10 42 4 32 12 Z" fill="#c1121f"/>
        <rect x="30" y="50" width="4" height="46" rx="2" fill="#1a1a1a"/>
        <path d="M32 64 C20 62 14 70 16 78 C24 76 30 72 32 64 Z" fill="#1a1a1a"/>
        <path d="M32 72 C44 70 50 78 48 86 C40 84 34 80 32 72 Z" fill="#1a1a1a"/>
      </svg>
    </div>

    <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Tap the middle of the envelope to open">
      <div class="env-back"></div>

      <!-- Letter card -->
      <div class="letter-card" id="letterCard">
        <div class="letter-inner">
          <button class="close-btn" id="closeBtn" aria-label="Close letter">×</button>
          
          <p class="letter-to">To: <span class="placeholder">[Partner Name]</span></p>
          <p class="letter-body" id="letterBody">Loading your letter...</p>
          <p class="letter-from">From: <span class="placeholder">[Your Name]</span></p>
        </div>
      </div>

      <!-- Front flaps -->
      <div class="env-front">
        <div class="flap-left"></div>
        <div class="flap-right"></div>
        <div class="flap-bottom"></div>
        <div class="flap-top" id="flapTop"></div>
      </div>

      <!-- Tulip accent on envelope -->
      <div class="tulip">
        <svg viewBox="0 0 64 96" xmlns="http://www.w3.org/2000/svg">
          <path d="M32 12 C22 4 12 10 14 24 C16 38 26 44 32 50 C38 44 48 38 50 24 C52 10 42 4 32 12 Z" fill="#c1121f"/>
          <rect x="30" y="50" width="4" height="38" rx="2" fill="#2b2b2b"/>
          <path d="M32 64 C20 62 14 70 16 78 C24 76 30 72 32 64 Z" fill="#2b2b2b"/>
        </svg>
      </div>

      <p class="hint" id="hint">tap the middle to open</p>
    </div>
  </main>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    // ==========================================
    // 1. SUPABASE SETUP (Add your keys here)
    // ==========================================
    const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co"; // <-- REPLACE THIS
    const SUPABASE_ANON_KEY = "YOUR-ANON-PUBLIC-KEY";        // <-- REPLACE THIS

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ==========================================
    // 2. PETAL ANIMATION
    // ==========================================
    (function spawnPetals() {
      const layer = document.getElementById("petals");
      for (let i = 0; i < 18; i++) {
        const petal = document.createElement("span");
        petal.className = "petal";
        petal.style.left = (Math.random() * 100) + "vw";
        petal.style.animationDuration = (6 + Math.random() * 8) + "s";
        petal.style.animationDelay = (-Math.random() * 14) + "s";
        petal.style.transform = `scale(${0.6 + Math.random() * 0.9})`;
        petal.style.filter = Math.random() > 0.7 ? "blur(1px)" : "none";
        layer.appendChild(petal);
      }
    })();

    // ==========================================
    // 3. ENVELOPE LOGIC
    // ==========================================
    const envelope = document.getElementById("envelope");
    const bouquet = document.getElementById("bouquet");
    const letterBody = document.getElementById("letterBody");
    const closeBtn = document.getElementById("closeBtn");

    let isOpen = false;

    function openEnvelope() {
      if (isOpen) return;
      isOpen = true;
      envelope.classList.add("open");
    }

    function closeEnvelope() {
      if (!isOpen) return;
      
      envelope.classList.add("closing");
      bouquet.classList.remove("show"); // Hide bouquet while closing
      
      setTimeout(() => {
        envelope.classList.remove("open");
        envelope.classList.remove("closing");
        isOpen = false;
        bouquet.classList.add("show"); // Bloom bouquet!
      }, 1100); // Matches animation speed
    }

    // Close button listener (Stops event bubbling so it doesn't reopen)
    closeBtn.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation(); 
      closeEnvelope();
    });

    // Envelope click listener
    envelope.addEventListener("click", (e) => {
      if (isOpen) return;
      const rect = envelope.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      
      // Tap middle zone
      if (x > 0.2 && x < 0.8 && y > 0.2 && y < 0.8) {
        openEnvelope();
      }
    });

    // Keyboard accessibility
    envelope.addEventListener("keydown", (e) => {
      if ((e.key === "Enter" || e.key === " ") && !isOpen) {
        e.preventDefault();
        openEnvelope();
      }
    });

    // ==========================================
    // 4. LOAD LETTER FROM SUPABASE
    // ==========================================
    (async function loadLetter() {
      try {
        const { data, error } = await supabaseClient
          .from("letters")
          .select("content")
          .order("updated_at", { ascending: false })
          .limit(1)
          .single();

        if (error) throw error;
        
        if (data && data.content) {
          letterBody.textContent = data.content;
        } else {
          letterBody.textContent = "[Letter not found in database.]";
        }
      } catch (err) {
        console.error("Supabase error:", err);
        letterBody.textContent = "[Could not load letter. Check your keys.]";
      }
    })();
  </script>
</body>
</html>
